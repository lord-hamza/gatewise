<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="389" viewBox="0 0 1040 389" role="img" aria-labelledby="t">
<title id="t">gatewise quickstart: one async gateway in front of OpenAI and Anthropic with failover</title>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}.c{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.c{animation:none}}</style>
<rect x="0.5" y="0.5" width="1039" height="388" rx="12" fill="#1d2021" stroke="#3c3836"/>
<path d="M0.5 12.5a12 12 0 0 1 12-12h1015a12 12 0 0 1 12 12v32h-1039z" fill="#282828"/>
<line x1="0.5" y1="44.5" x2="1039.5" y2="44.5" stroke="#3c3836"/>
<circle cx="24" cy="22" r="6" fill="#fb4934"/><circle cx="44" cy="22" r="6" fill="#fabd2f"/><circle cx="64" cy="22" r="6" fill="#b8bb26"/>
<rect x="88" y="8" width="248" height="37" rx="6" fill="#1d2021"/>
<text x="104" y="32" font-size="15" fill="#d5c4a1">gatewise / quickstart.py</text>
<text x="74" y="88" font-size="15" fill="#665c54" text-anchor="end">1</text>
<text x="96" y="88" font-size="19" xml:space="preserve"><tspan fill="#928374"># gatewise: failover, caching, token budgets and guardrails for LLM calls</tspan></text>
<text x="74" y="119" font-size="15" fill="#665c54" text-anchor="end">2</text>
<text x="96" y="119" font-size="19" xml:space="preserve"><tspan fill="#fb4934">from </tspan><tspan fill="#ebdbb2">gatewise </tspan><tspan fill="#fb4934">import </tspan><tspan fill="#ebdbb2">AnthropicProvider, Gateway, OpenAIProvider</tspan></text>
<text x="74" y="150" font-size="15" fill="#665c54" text-anchor="end">3</text>
<text x="96" y="150" font-size="19" xml:space="preserve"></text>
<text x="74" y="181" font-size="15" fill="#665c54" text-anchor="end">4</text>
<text x="96" y="181" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">providers = [</tspan></text>
<text x="74" y="212" font-size="15" fill="#665c54" text-anchor="end">5</text>
<text x="96" y="212" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">    </tspan><tspan fill="#8ec07c">OpenAIProvider</tspan><tspan fill="#ebdbb2">(</tspan><tspan fill="#b8bb26">"gpt-5-mini"</tspan><tspan fill="#ebdbb2">),           </tspan><tspan fill="#928374"># tried first</tspan></text>
<text x="74" y="243" font-size="15" fill="#665c54" text-anchor="end">6</text>
<text x="96" y="243" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">    </tspan><tspan fill="#8ec07c">AnthropicProvider</tspan><tspan fill="#ebdbb2">(</tspan><tspan fill="#b8bb26">"claude-haiku-5-5"</tspan><tspan fill="#ebdbb2">),  </tspan><tspan fill="#928374"># takes over if it fails</tspan></text>
<text x="74" y="274" font-size="15" fill="#665c54" text-anchor="end">7</text>
<text x="96" y="274" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">]</tspan></text>
<text x="74" y="305" font-size="15" fill="#665c54" text-anchor="end">8</text>
<text x="96" y="305" font-size="19" xml:space="preserve"><tspan fill="#fb4934">async with </tspan><tspan fill="#8ec07c">Gateway</tspan><tspan fill="#ebdbb2">(providers) </tspan><tspan fill="#fb4934">as </tspan><tspan fill="#ebdbb2">gateway:</tspan></text>
<text x="74" y="336" font-size="15" fill="#665c54" text-anchor="end">9</text>
<text x="96" y="336" font-size="19" xml:space="preserve"><tspan fill="#ebdbb2">    response = </tspan><tspan fill="#fb4934">await </tspan><tspan fill="#ebdbb2">gateway.</tspan><tspan fill="#83a598">complete</tspan><tspan fill="#ebdbb2">(</tspan><tspan fill="#b8bb26">"Explain backpressure in one paragraph."</tspan><tspan fill="#ebdbb2">)</tspan></text>
</svg>
